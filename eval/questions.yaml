  - id: w0-08
    category: summary
    knowledge_date: "2026-10-15"
    question: "Summarize the main operating, development, and funding outcomes in CXO's September 2026 quarter."
    expected_answer: >-
      Finniss produced first spodumene concentrate after plant upgrades expected
      to lift throughput by about 20% to 1.2 Mtpa, with first shipment targeted
      for the December quarter. BP33 development remained on track for first
      development ore in mid-CY27 and drilling returned a 34.08 m at 2.09% Li2O
      intercept. Sales of the remaining lithium-fines stockpile brought 2026
      stockpile-sale revenue to about A$38.5 million. Receipt of US$44 million
      in Tranche 2 funding completed the package through to steady-state
      production in 2028, and quarter-end cash was A$200 million.
    sources:
      - document_id: 20261013-2139-Quarterly-Activities-and-Cashflow-Report-6A1349068
        evidence: >-
          September-quarter highlights report first concentrate, upgraded
          throughput, BP33 development and drilling, the final fines sale,
          completed funding through steady-state production in 2028, and
          A$200 million cash at 30 September 2026.

