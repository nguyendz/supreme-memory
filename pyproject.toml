[project]
name = "agent-memory"
version = "0.1.0"
description = "Point-in-time memory for public-company announcements"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.27.3",
]

[project.scripts]
am = "agent_memory.cli:app"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
